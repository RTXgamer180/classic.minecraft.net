
name: Launch Minecraft Classic

on:
  push:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: minecraft-classic
  cancel-in-progress: true

jobs:
  launch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Create website directory
        run: |
          DEST="dist/a/b/c/coords/x/y/z/Minecraft/classic.minecraft.net"
          mkdir -p "$DEST"
          git archive HEAD | tar -x -C "$DEST"
          touch dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy website
        uses: actions/deploy-pages@v4


name: Launch Minecraft Classic Website

on:
  schedule:
    - cron: "*/5 * * * *"

  push:
    branches:
      - "a/b/c/coords/x/y/z/classic.minecraft.net"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: minecraft-classic-pages
  cancel-in-progress: true

jobs:
  launch:
    runs-on: ubuntu-latest

    steps:
      - name: Download website
        uses: actions/checkout@v4
        with:
          ref: a/b/c/coords/x/y/z/classic.minecraft.net

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Launch website
        uses: actions/deploy-pages@v4
